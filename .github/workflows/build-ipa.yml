name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest available Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n1)
          if [ -z "$LATEST" ]; then
            LATEST="/Applications/Xcode.app"
          fi

          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/3105.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM=""

      - name: Package IPA
        run: |
          APP_PATH="$RUNNER_TEMP/3105.xcarchive/Products/Applications/3105.app"
          PAYLOAD_DIR="$RUNNER_TEMP/Payload"

          mkdir -p "$PAYLOAD_DIR"
          cp -R "$APP_PATH" "$PAYLOAD_DIR/"

          cd "$RUNNER_TEMP"
          zip -r -y 3105-unsigned.ipa Payload

          mkdir -p "${{ github.workspace }}/out"
          mv 3105-unsigned.ipa "${{ github.workspace }}/out/"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3105-unsigned-ipa
          path: out/3105-unsigned.ipa
          retention-days: 14
