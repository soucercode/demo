name: Xây dựng IPA chưa ký

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Kiểm tra source
        run: |
          echo "=== ROOT ==="
          pwd
          ls -la

          echo "=== 3105-main ==="
          ls -la "3105-main"

          echo "=== XCODE PROJECT ==="
          ls -la "3105-main/ThreeOneOSFive.xcodeproj"

      - name: Chọn Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)

          if [ -z "$XCODE_PATH" ]; then
            echo "Không tìm thấy Xcode."
            exit 1
          fi

          echo "Using: $XCODE_PATH"

          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"

          xcodebuild -version

      - name: Kiểm tra Scheme
        working-directory: 3105-main
        run: |
          xcodebuild \
            -project "ThreeOneOSFive.xcodeproj" \
            -list

      - name: Build Archive
        working-directory: 3105-main
        run: |
          rm -rf "$RUNNER_TEMP/3105.xcarchive"

          xcodebuild archive \
            -project "ThreeOneOSFive.xcodeproj" \
            -scheme "3105" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/3105.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Kiểm tra APP
        run: |
          APP_PATH="$RUNNER_TEMP/3105.xcarchive/Products/Applications/3105.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "❌ Không tìm thấy 3105.app"
            echo "=== ARCHIVE ==="
            find "$RUNNER_TEMP/3105.xcarchive" -maxdepth 6 -print
            exit 1
          fi

          echo "✅ APP đã build:"
          ls -la "$APP_PATH"

      - name: Đóng gói IPA
        run: |
          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"

          cp -R \
            "$RUNNER_TEMP/3105.xcarchive/Products/Applications/3105.app" \
            "$RUNNER_TEMP/Payload/"

          cd "$RUNNER_TEMP"

          rm -f "ProxySHOPDHP-unsigned.ipa"

          zip -qry \
            "ProxySHOPDHP-unsigned.ipa" \
            Payload

          mkdir -p "$GITHUB_WORKSPACE/out"

          cp \
            "ProxySHOPDHP-unsigned.ipa" \
            "$GITHUB_WORKSPACE/out/ProxySHOPDHP-unsigned.ipa"

          echo "✅ IPA:"
          ls -lh "$GITHUB_WORKSPACE/out/ProxySHOPDHP-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ProxySHOPDHP-unsigned-IPA
          path: out/ProxySHOPDHP-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
